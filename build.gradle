plugins {
    id 'io.nextflow.nextflow-plugin' version '0.0.1-alpha4'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '25.04.0'

    provider = 'seqera'
    className = 'seqera.plugin.NfCodespacesPlugin'
    extensionPoints = [
        'seqera.plugin.NfCodespacesExtension',
        'seqera.plugin.NfCodespacesFactory',
        'seqera.plugin.CodespacesExecutor'
    ]

    publishing {
        registry {
            url = 'https://nf-plugins-registry.dev-tower.net/api'
            authToken = project.findProperty('pluginRegistry.accessToken')
        }
    }
}
